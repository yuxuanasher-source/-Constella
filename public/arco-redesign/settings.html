<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>组织设置 · 经营舱</title>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style>
      :root {
        --bg-1: #ffffff;
        --bg-2: #f7f8fa;
        --fill-1: #f7f8fa;
        --fill-2: #f2f3f5;
        --border: #e5e6eb;
        --border-strong: #c9cdd4;
        --text-1: #1d2129;
        --text-2: #4e5969;
        --text-3: #86909c;
        --primary-1: #e8f3ff;
        --primary-2: #bedaff;
        --primary-6: #165dff;
        --primary-7: #0e42d2;
        --success-1: #e8ffea;
        --success-6: #00b42a;
        --danger-1: #ffece8;
        --danger-6: #f53f3f;
        --radius: 6px;
        --shadow: 0 1px 2px rgba(29, 33, 41, 0.04);
        --focus: 0 0 0 3px rgba(22, 93, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg-2);
        color: var(--text-1);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial,
          sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      input,
      select,
      a {
        outline: none;
      }

      button {
        border: 0;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100dvh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: var(--bg-1);
      }

      .brand {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
      }

      .brand img {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .brand-title {
        font-size: 16px;
        line-height: 20px;
        font-weight: 700;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--text-3);
        font-size: 11px;
      }

      .nav-group {
        padding: 14px 12px 0;
      }

      .nav-title {
        padding: 8px 10px;
        color: var(--text-3);
        font-size: 12px;
        font-weight: 600;
      }

      .nav-item {
        min-width: 0;
        height: 38px;
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        padding: 0 10px;
        border-radius: var(--radius);
        color: var(--text-2);
        font-size: 13px;
        text-decoration: none;
        transition:
          color 160ms ease,
          background-color 160ms ease;
      }

      .nav-item iconify-icon {
        width: 18px;
        height: 18px;
        font-size: 18px;
      }

      .nav-item:hover {
        background: var(--fill-1);
        color: var(--text-1);
      }

      .nav-item.active {
        background: var(--primary-1);
        color: var(--primary-7);
        font-weight: 600;
      }

      .nav-badge {
        min-width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--fill-2);
        color: var(--text-3);
        font-size: 11px;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 14px 16px 18px;
        border-top: 1px solid var(--border);
      }

      .account-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-2);
      }

      .account-mark,
      .avatar {
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--primary-1);
        color: var(--primary-7);
        font-weight: 700;
      }

      .account-mark {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }

      .account-card strong {
        display: block;
        font-size: 12px;
      }

      .account-card span {
        display: block;
        margin-top: 2px;
        color: var(--text-3);
        font-size: 11px;
      }

      .main {
        min-width: 0;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: var(--text-3);
        font-size: 13px;
      }

      .breadcrumb b {
        color: var(--text-1);
        font-weight: 600;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-button {
        position: relative;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-1);
        color: var(--text-2);
        cursor: pointer;
      }

      .icon-button iconify-icon {
        font-size: 17px;
      }

      .notification-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        border: 1.5px solid var(--bg-1);
        border-radius: 50%;
        background: var(--danger-6);
      }

      .avatar {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }

      .content {
        padding: 20px 24px 32px;
      }

      .page-head {
        margin-bottom: 16px;
      }

      .page-head h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
      }

      .page-head p {
        margin: 6px 0 0;
        color: var(--text-3);
        font-size: 13px;
        line-height: 20px;
      }

      .settings-layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 12px;
        align-items: stretch;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-1);
        box-shadow: var(--shadow);
      }

      .settings-nav {
        min-height: 478px;
        padding: 8px;
      }

      .settings-nav button {
        width: 100%;
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border-radius: var(--radius);
        background: transparent;
        color: var(--text-2);
        text-align: left;
        font-size: 13px;
        cursor: default;
        transition:
          color 160ms ease,
          background-color 160ms ease;
      }

      .settings-nav button + button {
        margin-top: 2px;
      }

      .settings-nav button:not(.active):hover {
        background: var(--fill-1);
        color: var(--text-1);
      }

      .settings-nav button.active {
        background: var(--primary-1);
        color: var(--primary-7);
        font-weight: 600;
      }

      .settings-panel {
        min-width: 0;
        min-height: 478px;
        padding: 18px 20px 16px;
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 18px;
        line-height: 26px;
        font-weight: 700;
      }

      .panel-head p {
        margin: 3px 0 0;
        color: var(--text-3);
        font-size: 13px;
        line-height: 20px;
      }

      .primary-button {
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex: 0 0 auto;
        padding: 0 14px;
        border: 1px solid var(--primary-6);
        border-radius: var(--radius);
        background: var(--primary-6);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 100ms ease;
      }

      .primary-button iconify-icon {
        font-size: 16px;
      }

      .primary-button:hover {
        border-color: var(--primary-7);
        background: var(--primary-7);
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      .primary-button:disabled {
        border-color: var(--primary-2);
        background: var(--primary-2);
        cursor: wait;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 16px;
      }

      .field {
        min-width: 0;
      }

      .field label {
        display: block;
        margin-bottom: 7px;
        color: var(--text-2);
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
      }

      .control,
      .switch-field {
        width: 100%;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-1);
        color: var(--text-1);
        font-size: 13px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .control {
        padding: 0 10px;
      }

      .control::placeholder {
        color: var(--text-3);
      }

      .control:hover,
      .switch-field:hover {
        border-color: var(--border-strong);
      }

      .control:focus {
        border-color: var(--primary-6);
        box-shadow: var(--focus);
      }

      .switch-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
      }

      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        flex: 0 0 auto;
        border-radius: 11px;
        background: var(--primary-6);
        cursor: pointer;
        transition:
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 18px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(29, 33, 41, 0.2);
        transition: left 160ms ease;
      }

      .switch[aria-checked="false"] {
        background: var(--border-strong);
      }

      .switch[aria-checked="false"]::after {
        left: 2px;
      }

      .audit-note {
        margin: 18px 0 0;
        color: var(--text-3);
        font-size: 12px;
        line-height: 18px;
      }

      .toast {
        position: fixed;
        z-index: 40;
        top: 84px;
        left: 50%;
        min-width: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid #aff0b5;
        border-radius: var(--radius);
        background: var(--success-1);
        color: #078c22;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(29, 33, 41, 0.1);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -8px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.error {
        border-color: #fdcdc5;
        background: var(--danger-1);
        color: var(--danger-6);
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .icon-button:hover {
        border-color: var(--border-strong);
        background: var(--fill-1);
        color: var(--text-1);
      }

      .nav-item:focus-visible,
      .icon-button:focus-visible,
      .settings-nav button:focus-visible,
      .primary-button:focus-visible,
      .switch:focus-visible {
        box-shadow: var(--focus);
      }

      @media (max-width: 1024px) {
        .app-shell {
          grid-template-columns: 220px minmax(0, 1fr);
        }

        .settings-layout {
          grid-template-columns: 228px minmax(0, 1fr);
        }
      }

      @media (max-width: 900px) {
        .app-shell {
          display: block;
        }

        .sidebar {
          position: static;
          height: auto;
          overflow: hidden;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .brand {
          height: 60px;
          border-bottom: 0;
        }

        .nav-group {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding: 0 12px 10px;
          scrollbar-width: none;
        }

        .nav-group::-webkit-scrollbar {
          display: none;
        }

        .nav-title,
        .sidebar-footer {
          display: none;
        }

        .nav-item {
          flex: 0 0 auto;
          grid-template-columns: 20px auto auto;
          margin: 0;
        }

        .settings-layout {
          grid-template-columns: 1fr;
        }

        .settings-nav {
          min-height: 0;
          display: flex;
          gap: 4px;
          overflow-x: auto;
          padding: 8px;
          scrollbar-width: none;
        }

        .settings-nav::-webkit-scrollbar {
          display: none;
        }

        .settings-nav button {
          width: auto;
          flex: 0 0 auto;
          padding: 0 12px;
        }

        .settings-nav button + button {
          margin: 0;
        }

        .settings-panel {
          min-height: 0;
        }
      }

      @media (max-width: 640px) {
        .topbar {
          height: 60px;
          padding: 0 16px;
        }

        .breadcrumb span {
          display: none;
        }

        .content {
          padding: 16px;
        }

        .page-head h1 {
          font-size: 22px;
          line-height: 30px;
        }

        .settings-panel {
          padding: 16px;
        }

        .panel-head {
          flex-direction: column;
        }

        .primary-button {
          width: 100%;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .audit-note {
          margin-top: 16px;
        }
      }

      @media (max-width: 420px) {
        .brand-subtitle {
          display: none;
        }

        .nav-item .nav-badge {
          display: none;
        }

        .content {
          padding: 12px;
        }

        .settings-panel {
          padding: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link rel="stylesheet" href="./sidebar.css" />
    <link rel="stylesheet" href="./typography.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../brand/ops-mascot-logo.png" alt="经营舱品牌标识" />
          <div>
            <div class="brand-title">经营舱</div>
            <div class="brand-subtitle">MCN Operations Suite</div>
          </div>
        </div>

        <nav class="nav-group" aria-label="主导航">
          <div class="nav-title">工作台</div>
          <a class="nav-item" href="./index.html">
            <iconify-icon
              icon="lucide:layout-dashboard"
              aria-hidden="true"
            ></iconify-icon>
            <span>经营总览</span>
            <span class="nav-badge">12</span>
          </a>
          <a class="nav-item" href="./projects.html">
            <iconify-icon
              icon="lucide:folder-kanban"
              aria-hidden="true"
            ></iconify-icon>
            <span>项目管理</span>
            <span class="nav-badge">19</span>
          </a>
          <a class="nav-item" href="./streamers.html">
            <iconify-icon icon="lucide:users" aria-hidden="true"></iconify-icon>
            <span>主播资源池</span>
            <span class="nav-badge">86</span>
          </a>
          <a class="nav-item" href="./admissions.html">
            <iconify-icon
              icon="lucide:circle-play"
              aria-hidden="true"
            ></iconify-icon>
            <span>选播准入</span>
            <span class="nav-badge">27</span>
          </a>
          <a class="nav-item" href="./schedules.html">
            <iconify-icon
              icon="lucide:calendar-days"
              aria-hidden="true"
            ></iconify-icon>
            <span>排班直播</span>
            <span class="nav-badge">8</span>
          </a>
          <a class="nav-item" href="./reports.html">
            <iconify-icon
              icon="lucide:clipboard-check"
              aria-hidden="true"
            ></iconify-icon>
            <span>报数审核</span>
            <span class="nav-badge">35</span>
          </a>
          <a class="nav-item" href="./settlements.html">
            <iconify-icon
              icon="lucide:circle-dollar-sign"
              aria-hidden="true"
            ></iconify-icon>
            <span>结算中心</span>
            <span class="nav-badge">5</span>
          </a>
          <a class="nav-item" href="./audit.html">
            <iconify-icon
              icon="lucide:file-search"
              aria-hidden="true"
            ></iconify-icon>
            <span>审计与导出</span>
            <span class="nav-badge">4</span>
          </a>
          <a class="nav-item" href="./ai-workbench.html">
            <iconify-icon
              icon="lucide:sparkles"
              aria-hidden="true"
            ></iconify-icon>
            <span>星耀 AI 作战台</span>
            <span class="nav-badge">AI</span>
          </a>
          <a class="nav-item" href="./knowledge-base.html">
            <iconify-icon
              icon="lucide:library-big"
              aria-hidden="true"
            ></iconify-icon>
            <span>知识库</span>
            <span class="nav-badge">48</span>
          </a>
          <a class="nav-item active" href="./settings.html" aria-current="page">
            <iconify-icon
              icon="lucide:settings-2"
              aria-hidden="true"
            ></iconify-icon>
            <span>组织设置</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="account-card">
            <div class="account-mark">星</div>
            <div>
              <strong>星耀传媒</strong>
              <span>组织管理员</span>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb">
            <span>经营舱</span>
            <span>/</span>
            <b>组织设置</b>
          </div>
          <div class="top-actions">
            <button
              class="icon-button"
              type="button"
              aria-label="通知，3 条未读"
              title="通知"
            >
              <iconify-icon
                icon="lucide:bell"
                aria-hidden="true"
              ></iconify-icon>
              <span class="notification-dot" aria-hidden="true"></span>
            </button>
            <div
              class="avatar"
              aria-label="当前组织：星耀传媒"
              title="星耀传媒"
            >
              星
            </div>
          </div>
        </header>

        <section class="content">
          <div class="page-head">
            <h1>组织设置</h1>
            <p>最近数据更新于 14:32。</p>
          </div>

          <div class="settings-layout">
            <nav class="card settings-nav" aria-label="设置分类">
              <button class="active" type="button" aria-current="page">
                组织品牌
              </button>
              <button type="button" aria-disabled="true">成员与角色</button>
              <button type="button" aria-disabled="true">项目结算规则</button>
              <button type="button" aria-disabled="true">AI 安全与审计</button>
              <button type="button" aria-disabled="true">导出字段策略</button>
              <button type="button" aria-disabled="true">套餐与用量</button>
            </nav>

            <form class="card settings-panel" id="organization-form" novalidate>
              <div class="panel-head">
                <div>
                  <h2>组织设置</h2>
                  <p>品牌信息将用于工作台、分享页与经营日报。</p>
                </div>
                <button class="primary-button" id="save-button" type="submit">
                  <iconify-icon
                    icon="lucide:save"
                    aria-hidden="true"
                  ></iconify-icon>
                  <span>保存配置</span>
                </button>
              </div>

              <div class="form-grid">
                <div class="field">
                  <label for="organization-name">组织名称</label>
                  <input
                    class="control"
                    id="organization-name"
                    name="organizationName"
                    value="星耀传媒"
                    autocomplete="organization"
                    required
                  />
                </div>
                <div class="field">
                  <label for="brand-wordmark">品牌字标</label>
                  <input
                    class="control"
                    id="brand-wordmark"
                    name="brandWordmark"
                    value="星耀经营舱"
                    maxlength="12"
                  />
                </div>
                <div class="field">
                  <label for="vendor-rate">默认厂家单价</label>
                  <input
                    class="control"
                    id="vendor-rate"
                    name="vendorRate"
                    value="¥120 / 小时"
                    inputmode="decimal"
                  />
                </div>
                <div class="field">
                  <label for="review-threshold">报数复核阈值</label>
                  <select
                    class="control"
                    id="review-threshold"
                    name="reviewThreshold"
                  >
                    <option selected>弱证据或毛利低于 20%</option>
                    <option>弱证据或毛利低于 15%</option>
                    <option>所有弱证据均需人工复核</option>
                  </select>
                </div>
                <div class="field">
                  <label for="ai-gateway">AI 草稿确认网关</label>
                  <div class="switch-field">
                    <span id="gateway-status">开启</span>
                    <button
                      class="switch"
                      id="ai-gateway"
                      type="button"
                      role="switch"
                      aria-checked="true"
                      aria-labelledby="gateway-status"
                    ></button>
                  </div>
                </div>
                <div class="field">
                  <label for="audit-retention">审计日志留存</label>
                  <select
                    class="control"
                    id="audit-retention"
                    name="auditRetention"
                  >
                    <option>180 天</option>
                    <option selected>365 天</option>
                    <option>永久留存</option>
                  </select>
                </div>
              </div>

              <p class="audit-note" id="audit-note">
                最近修改：2026-07-13
                14:28，由组织管理员「星河」更新。所有配置变更将写入审计日志。
              </p>
            </form>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <iconify-icon
        icon="lucide:circle-check"
        aria-hidden="true"
      ></iconify-icon>
      <span id="toast-message">配置已保存</span>
    </div>

    <script>
      const form = document.querySelector("#organization-form");
      const organizationName = document.querySelector("#organization-name");
      const switchButton = document.querySelector("#ai-gateway");
      const gatewayStatus = document.querySelector("#gateway-status");
      const saveButton = document.querySelector("#save-button");
      const saveButtonLabel = saveButton.querySelector("span");
      const auditNote = document.querySelector("#audit-note");
      const toast = document.querySelector("#toast");
      const toastMessage = document.querySelector("#toast-message");
      let toastTimer;

      function showToast(message, isError = false) {
        clearTimeout(toastTimer);
        toastMessage.textContent = message;
        toast.classList.toggle("error", isError);
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      switchButton.addEventListener("click", () => {
        const nextChecked =
          switchButton.getAttribute("aria-checked") !== "true";
        switchButton.setAttribute("aria-checked", String(nextChecked));
        gatewayStatus.textContent = nextChecked ? "开启" : "关闭";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!organizationName.value.trim()) {
          organizationName.focus();
          showToast("请填写组织名称", true);
          return;
        }

        saveButton.disabled = true;
        saveButtonLabel.textContent = "保存中";

        window.setTimeout(() => {
          const now = new Date();
          const date = new Intl.DateTimeFormat("zh-CN", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          })
            .format(now)
            .replaceAll("/", "-");

          auditNote.textContent = `最近修改：${date}，由组织管理员「星河」更新。所有配置变更将写入审计日志。`;
          saveButton.disabled = false;
          saveButtonLabel.textContent = "保存配置";
          showToast("配置已保存");
        }, 420);
      });
    </script>
  </body>
</html>
