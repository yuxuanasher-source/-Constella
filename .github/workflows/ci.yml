name: CI

on:
  pull_request:
  push:
    branches:
      - codex/full-project-ui

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pure repository verification does not require production-network access.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce changed-file formatting
        if: github.event_name == 'pull_request'
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:changed-format

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Enforce critical-domain coverage
        run: pnpm test:critical-coverage

      - name: Build
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual smoke tests
        run: pnpm test:ops-visual

      - name: Enforce client bundle budgets
        run: pnpm check:bundle-budget

      - name: Produce reviewed release artifact
        id: release-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/full-project-ui'
        run: |
          node scripts/prepare-standalone-release.mjs "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          node scripts/release-integrity.mjs write "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          artifact="release-runtime-${GITHUB_SHA}.tar"
          tar --format=ustar --sort=name --mtime='@0' \
            --owner=0 --group=0 --numeric-owner \
            -cf "$artifact" .release-integrity.json .next/standalone
          manifest_sha256="$(sha256sum .release-integrity.json | awk '{print $1}')"
          artifact_sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          {
            printf 'Release Git SHA: `%s`\n' "$GITHUB_SHA"
            printf 'Release manifest SHA-256: `%s`\n' "$manifest_sha256"
            printf 'Release artifact SHA-256: `%s`\n' "$artifact_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify reviewed release artifact round trip
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/full-project-ui'
        env:
          ARTIFACT_PATH: ${{ steps.release-artifact.outputs.path }}
          ARTIFACT_SHA256: ${{ steps.release-artifact.outputs.artifact_sha256 }}
          MANIFEST_SHA256: ${{ steps.release-artifact.outputs.manifest_sha256 }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-release-artifact-roundtrip.mjs \
            "$GITHUB_WORKSPACE/$ARTIFACT_PATH" \
            "$ARTIFACT_SHA256" "$MANIFEST_SHA256" "$RELEASE_SHA"

      - name: Upload reviewed release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/full-project-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-runtime-${{ github.sha }}
          path: ${{ steps.release-artifact.outputs.path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  database-regression:
    # GitHub-hosted Ubuntu includes Docker, which the local Supabase stack uses.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Stop Realtime before database reset
        run: docker stop supabase_realtime_jingying-cabin

      - name: Apply database migrations
        run: pnpm supabase:migrate

      - name: Restart Realtime
        run: docker start supabase_realtime_jingying-cabin

      - name: Run settlement database regressions
        env:
          CUSTOM_SETTLEMENT_RUNTIME_DB_REGRESSION_CONTAINER: supabase_db_jingying-cabin
          SETTLEMENT_AI_DB_LOCK_REGRESSION_CONTAINER: supabase_db_jingying-cabin
        run: pnpm exec vitest run lib/db/schema-contract.test.ts

      - name: Run atomic deploy database and PostgREST contract
        env:
          RUN_DEPLOY_DB_TESTS: 1
          DEPLOY_DB_TEST_CONTAINER: supabase_db_jingying-cabin
          DEPLOY_POSTGREST_TEST_CONTAINER: supabase_rest_jingying-cabin
        run: pnpm exec vitest run scripts/deploy-database-contract.test.mjs

      - name: Stop Realtime before forward migration regression
        run: docker stop supabase_realtime_jingying-cabin

      - name: Run settlement forward migration regression
        env:
          CUSTOM_SETTLEMENT_RUNTIME_UPGRADE_REGRESSION_CONTAINER: supabase_db_jingying-cabin
          CUSTOM_SETTLEMENT_RUNTIME_UPGRADE_REALTIME_CONTAINER: supabase_realtime_jingying-cabin
        run: pnpm exec vitest run lib/db/custom-settlement-runtime-upgrade.test.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
