name: CI

on:
  pull_request:
  push:
    branches:
      - codex/full-project-ui

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pure repository verification does not require production-network access.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database-regression:
    # GitHub-hosted Ubuntu includes Docker, which the local Supabase stack uses.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Stop Realtime before database reset
        run: docker stop supabase_realtime_jingying-cabin

      - name: Apply database migrations
        run: pnpm supabase:migrate

      - name: Restart Realtime
        run: docker start supabase_realtime_jingying-cabin

      - name: Run settlement database regressions
        env:
          CUSTOM_SETTLEMENT_RUNTIME_DB_REGRESSION_CONTAINER: supabase_db_jingying-cabin
          SETTLEMENT_AI_DB_LOCK_REGRESSION_CONTAINER: supabase_db_jingying-cabin
        run: pnpm exec vitest run lib/db/schema-contract.test.ts

      - name: Stop Realtime before forward migration regression
        run: docker stop supabase_realtime_jingying-cabin

      - name: Run settlement forward migration regression
        env:
          CUSTOM_SETTLEMENT_RUNTIME_UPGRADE_REGRESSION_CONTAINER: supabase_db_jingying-cabin
          CUSTOM_SETTLEMENT_RUNTIME_UPGRADE_REALTIME_CONTAINER: supabase_realtime_jingying-cabin
        run: pnpm exec vitest run lib/db/custom-settlement-runtime-upgrade.test.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
