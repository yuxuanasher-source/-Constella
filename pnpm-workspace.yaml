overrides:
  "exceljs>archiver": 7.0.1
  "exceljs>unzipper": 0.12.5
  "exceljs>uuid": 11.1.1
  "readdir-glob@1.1.3>minimatch": 10.2.5
  "glob@10.5.0>minimatch": 10.2.5
  "minimatch@10.2.5>brace-expansion": 5.0.8
  "jsdom>undici": 7.28.0
  "@eslint/eslintrc>js-yaml": 4.3.0
  postcss: 8.5.18
  sharp: 0.35.0

patchedDependencies:
  archiver-utils@5.0.2: patches/archiver-utils@5.0.2.patch

# GHSA-mh99-v99m-4gvg's registry range overmatches brace-expansion@1.1.18.
# That exact CJS maintenance release backports EXPANSION_MAX_LENGTH; security
# contracts verify its bounded behavior and that no other vulnerable versions are locked.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

strictDepBuilds: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

allowBuilds:
  sharp: set this to true or false
  unrs-resolver: set this to true or false
